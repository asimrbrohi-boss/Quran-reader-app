<header>
  <div class="wrap">
    <h1>Quran Reader</h1>
    <p class="subtitle">Read • Reflect • Recite</p>
    <p>Read, listen and reflect — English, French and transliteration included.</p>

    <div class="controls">
      <label>
        Surah
        <select id="surah" aria-label="Choose a surah"></select>
      </label>

      <label>
        Translation
        <select id="language" aria-label="Choose translation"></select>
      </label>
    </div>

    <div class="options">
      <label class="check-label">
        <input id="continuous" type="checkbox">
        Continuous recitation
      </label>

      <label>
        Speed
        <select id="speed" aria-label="Recitation speed">
          <option value="0.75">0.75×</option>
          <option value="1" selected>Normal</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
      </label>

      <button id="load" class="primary">Load surah</button>
    </div>

    <button id="theme" class="theme" type="button">🌙 Dark mode</button>
  </div>
</header>
