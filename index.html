<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b6b57">
  <meta name="description" content="Read and listen to the Quran with English, French and transliteration support.">
  <link rel="manifest" href="manifest.json">
  <title>Quran Reader</title>
  <style>
   :root {
  color-scheme: light;
  --green: #0b6b57;
  --green-dark: #075441;
  --ink: #19332d;
  --muted: #66756f;
  --paper: rgba(255, 255, 255, 0.94);
  --bg: #f4f8f6;
  --line: #dce8e3;
  --gold: #c79537;
  --pattern: rgba(11, 107, 87, 0.055);
  --shadow: rgba(27, 89, 64, 0.08);
}

:root.dark {
  color-scheme: dark;
  --green: #62c7a8;
  --green-dark: #0b3d32;
  --ink: #e6f0ed;
  --muted: #a8bab4;
  --paper: rgba(24, 37, 33, 0.95);
  --bg: #0f1715;
  --line: #30433c;
  --gold: #d7ab4e;
  --pattern: rgba(98, 199, 168, 0.06);
  --shadow: rgba(0, 0, 0, 0.22);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  min-height: 100vh;
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background-color: var(--bg);

  /* Subtle eight-point geometric pattern */
  background-image:
    linear-gradient(45deg, var(--pattern) 25%, transparent 25%),
    linear-gradient(-45deg, var(--pattern) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--pattern) 75%),
    linear-gradient(-45deg, transparent 75%, var(--pattern) 75%);
  background-position: 0 0, 0 12px, 12px -12px, -12px 0;
  background-size: 24px 24px;

  transition: background-color 0.2s ease, color 0.2s ease;
}

header {
  position: relative;
  overflow: hidden;
  color: #fff;
  background:
    linear-gradient(135deg, rgba(7, 84, 65, 0.97), rgba(18, 144, 113, 0.94)),
    repeating-linear-gradient(
      45deg,
      transparent 0,
      transparent 12px,
      rgba(255, 255, 255, 0.045) 12px,
      rgba(255, 255, 255, 0.045) 13px
    );
  border-bottom: 4px solid var(--gold);
  padding: 2.5rem 1rem 2rem;
}

header::before,
header::after {
  position: absolute;
  content: "";
  width: 150px;
  height: 150px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  transform: rotate(45deg);
  pointer-events: none;
}

header::before {
  top: -95px;
  right: 8%;
  box-shadow:
    0 0 0 16px rgba(255, 255, 255, 0.04),
    0 0 0 32px rgba(255, 255, 255, 0.035);
}

header::after {
  bottom: -115px;
  left: 7%;
  box-shadow:
    0 0 0 16px rgba(255, 255, 255, 0.04),
    0 0 0 32px rgba(255, 255, 255, 0.035);
}

.wrap {
  position: relative;
  z-index: 1;
  width: min(100% - 2rem, 900px);
  margin: auto;
}

h1 {
  margin: 0 0 0.4rem;
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  letter-spacing: 0.02em;
}

header p {
  margin: 0.2rem 0 0;
  opacity: 0.9;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 0.75rem;
  margin-top: 1.5rem;
  align-items: end;
}

.options {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1rem;
  margin-top: 1rem;
  align-items: center;
}

label {
  display: grid;
  gap: 0.35rem;
  font-size: 0.85rem;
  font-weight: 650;
}

.check-label {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-weight: 600;
}

select,
button {
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0.65rem 0.8rem;
  font: inherit;
  background: var(--paper);
  color: var(--ink);
}

header select,
header button {
  color: #19332d;
}

button {
  cursor: pointer;
  font-weight: 700;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 10px var(--shadow);
}

button.primary {
  background: var(--gold);
  border-color: var(--gold);
  color: #fff;
}

button.theme {
  margin-top: 1rem;
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.5);
  color: #fff;
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}

main {
  padding: 1.5rem 0 3rem;
}

.notice {
  color: var(--muted);
  margin: 0.5rem 0 1rem;
}

.ayah {
  position: relative;
  overflow: hidden;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1.2rem;
  margin: 1rem 0;
  box-shadow: 0 4px 16px var(--shadow);
  backdrop-filter: blur(4px);
}

.ayah::before {
  position: absolute;
  top: 0;
  right: 0;
  content: "✦";
  color: var(--gold);
  font-size: 1.3rem;
  opacity: 0.55;
}

.ayah.playing {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(199, 149, 55, 0.25);
}

.ayah-head {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  color: var(--muted);
  font-size: 0.85rem;
}

.arabic {
  direction: rtl;
  text-align: right;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(1.65rem, 4vw, 2.25rem);
  line-height: 1.9;
  margin: 1rem 0;
}

.translit {
  color: var(--green);
  font-style: italic;
  line-height: 1.6;
}

.translation {
  line-height: 1.65;
  margin: 0.65rem 0 0;
}

.translation strong {
  color: var(--green);
}

audio {
  width: 100%;
  height: 38px;
  margin-top: 1rem;
}

.empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--muted);
}

.credit {
  text-align: center;
  color: var(--muted);
  font-size: 0.8rem;
  margin-top: 2rem;
}

@media (max-width: 650px) {
  .controls {
    grid-template-columns: 1fr;
  }

  .ayah-head {
    flex-wrap: wrap;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
